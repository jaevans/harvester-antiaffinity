# Not part of the kustomization: copy, fill in and apply separately.
# The token needs read access to harvestermachines.rke-machine.cattle.io in
# fleet-default on the Rancher "local" cluster.
apiVersion: v1
kind: Secret
metadata:
  name: rancher-credentials
  namespace: harvester-antiaffinity
type: Opaque
stringData:
  url: https://rancher.example.com
  token: token-xxxxx:yyyyyyyyyyyyyyyyyyyyyyyyyyyyyyyyyyyyyyyyyyyyyyyyyyyy
