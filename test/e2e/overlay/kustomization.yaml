apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../../../deploy
images:
  - name: ghcr.io/jaevans/harvester-antiaffinity
    newName: harvester-antiaffinity
    newTag: e2e
patches:
  - target:
      kind: CronJob
      name: harvester-antiaffinity
    patch: |-
      apiVersion: batch/v1
      kind: CronJob
      metadata:
        name: harvester-antiaffinity
      spec:
        suspend: true
        jobTemplate:
          spec:
            template:
              spec:
                containers:
                  - name: harvester-antiaffinity
                    imagePullPolicy: Never
                    env:
                      - name: DRY_RUN
                        value: "false"
                      - name: RANCHER_CLUSTER_PATH
                        value: ""
                      - name: RANCHER_CA_FILE
                        value: /var/run/secrets/rancher/ca.crt
                      - name: POLL_INTERVAL
                        value: 2s
                      - name: LOG_LEVEL
                        value: debug
